apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  # ClusterIP only, no Ingress: the WooCommerce MCP server is never exposed
  # outside the cluster. The NetworkPolicy narrows it further to the gateway.
  type: ClusterIP
  selector: {{- include "store.selector" (dict "root" . "component" "mcp") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp
  labels: {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels: {{- include "store.selector" (dict "root" . "component" "mcp") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "store.podSecurity" . | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: woo-mcp
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          securityContext:
            {{- include "store.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WC_BASE_URL
              value: http://{{ .Release.Name }}-web:8080
            - name: WC_TIMEOUT_MS
              value: {{ .Values.mcp.requestTimeoutMs | quote }}
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: wc-consumer-key }
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: wc-consumer-secret }
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: mcp-token }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources: {{- toYaml .Values.mcp.resources | nindent 12 }}

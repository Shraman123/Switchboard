apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels: {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    # Runs after every install and upgrade. The script is idempotent, so it
    # doubles as the "apply config + run WooCommerce DB migrations" step.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- include "store.podSecurity" . | nindent 8 }}
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      containers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "store.containerSecurity" . | nindent 12 }}
          command: ["/opt/store/bootstrap.sh"]
          env:
            {{- include "store.wpEnv" . | nindent 12 }}
            - name: SITE_URL
              value: {{ .Values.siteUrl | quote }}
            - name: STORE_TITLE
              value: {{ .Values.title | quote }}
            - name: STORE_TIMEZONE
              value: {{ .Values.timezone | quote }}
            - name: STORE_CURRENCY
              value: {{ .Values.currency | quote }}
            - name: STORE_COUNTRY
              value: {{ .Values.country | quote }}
            - name: ADMIN_USER
              value: {{ .Values.adminUser | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.adminEmail | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: admin-password }
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: wc-consumer-key }
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: wc-consumer-secret }
          resources: {{- toYaml .Values.bootstrap.resources | nindent 12 }}
          volumeMounts:
            - name: content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wp-content

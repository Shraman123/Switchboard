{{- if .Values.quota.enabled }}
# Guardrails for a provisioned store's namespace: a hard ceiling on what the
# whole store may consume, and defaults/ceilings per container.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Release.Name }}-quota
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  hard: {{- toYaml .Values.quota.hard | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ .Release.Name }}-limits
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default: {{- toYaml .Values.quota.containerDefault | nindent 8 }}
      defaultRequest: {{- toYaml .Values.quota.containerDefaultRequest | nindent 8 }}
      max: {{- toYaml .Values.quota.containerMax | nindent 8 }}
{{- end }}

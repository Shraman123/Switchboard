{{- range $name, $s := .Values.servers }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: switchboard
    app.kubernetes.io/name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: switchboard
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: upstream-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: switchboard
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: upstream-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: "{{ $s.image.repository }}:{{ $s.image.tag }}"
          imagePullPolicy: {{ $s.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            {{- with $s.tokenSecret }}
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .name }}, key: {{ .key }} }
            {{- end }}
          {{- if $s.healthPath }}
          readinessProbe:
            httpGet: { path: {{ $s.healthPath }}, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: {{ $s.healthPath }}, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          {{- else }}
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 15
            failureThreshold: 4
          {{- end }}
          resources: {{- toYaml $s.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
{{- end }}

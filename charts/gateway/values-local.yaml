publicUrl: http://gateway.localtest.me
backend:
  image: { repository: registry.localhost:5111/switchboard/gateway, tag: dev, pullPolicy: Always }
dashboard:
  image: { repository: registry.localhost:5111/switchboard/dashboard, tag: dev, pullPolicy: Always }

# Chat agent: Groq (values.yaml default) with the key from
# gateway-secrets/llm-api-key (scripts/set-llm-key.sh). For a fully offline
# local model instead, deploy with LLM=ollama (adds values-ollama.yaml).

# Store provisioning + hosted MCP servers. Each store gets
# http://<id>-store.localtest.me (localtest.me is wildcard DNS for 127.0.0.1).
provisioner:
  enabled: true
  image: { repository: registry.localhost:5111/switchboard/provisioner, tag: dev, pullPolicy: Always }
  storeUrlTemplate: "http://{slug}-store.localtest.me"
  storeValues:
    image: { repository: registry.localhost:5111/switchboard/woo-store, tag: dev, pullPolicy: IfNotPresent }
    mcp:
      image: { repository: registry.localhost:5111/switchboard/woo-mcp, tag: dev, pullPolicy: IfNotPresent }
  hostedImagePrefixes: [registry.localhost:5111/, ghcr.io/, docker.io/]
